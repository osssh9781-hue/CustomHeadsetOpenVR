schema_version = "1.0.0"
id = "mecha_lab"
version = "0.7.0"
name = "Mecha Lab"
tagline = "MECHA LAB workspace: Cut, Split, Boolean, Fuse, Mirror"
maintainer = "Mecha Lab project"
type = "add-on"
tags = ["Modeling"]
# Uses the Manifold Boolean solver (4.5+). Headless-tested on bpy 5.0.1 only.
blender_version_min = "4.5.0"
license = ["SPDX:GPL-3.0-or-later"]
[permissions]
files = "Read and write user-saved mesh, curve and PNG cut shape presets"
[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
