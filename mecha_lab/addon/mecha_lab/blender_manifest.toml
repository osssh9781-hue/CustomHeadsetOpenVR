schema_version = "1.0.0"
id = "mecha_lab"
version = "0.9.0"
name = "Mecha Lab"
tagline = "Cut, Split, Base Mesh, SubD Plane, Loft, ZBrush bridge"
maintainer = "Mecha Lab project"
type = "add-on"
tags = ["Modeling"]
# Uses the Manifold Boolean solver (4.5+). Headless-tested on bpy 5.0.1 only.
blender_version_min = "4.5.0"
license = ["SPDX:GPL-3.0-or-later"]
[permissions]
files = "Read and write presets, PNG cut shapes and ZBrush exchange OBJ files"
[build]
paths_exclude_pattern = ["__pycache__/", "*.pyc"]
